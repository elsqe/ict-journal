<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ICT Trading Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a0f;color:#e8e0d0;font-family:Georgia,serif;min-height:100vh;}
.header{background:linear-gradient(135deg,#0d0d18,#12121f);border-bottom:1px solid #1e1e35;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#c9a84c;}
.logo span{color:#6b8f71;}
.nav{display:flex;gap:4px;flex-wrap:wrap;}
.nb{background:none;border:1px solid transparent;color:#888;font-family:'JetBrains Mono',monospace;font-size:10px;padding:6px 12px;border-radius:6px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;}
.nb.on{background:#c9a84c22;color:#c9a84c;border-color:#c9a84c44;}
.con{max-width:1000px;margin:0 auto;padding:24px 14px;}
.card{background:#10101a;border:1px solid #1e1e35;border-radius:12px;padding:20px;margin-bottom:16px;}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:#10101a;border:1px solid #1e1e35;border-radius:10px;padding:14px;text-align:center;}
.sv{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:500;color:#c9a84c;}
.sv.g{color:#6bc47a;} .sv.r{color:#c46b6b;}
.sl{font-family:'JetBrains Mono',monospace;font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-top:3px;}
.wb{height:4px;background:#1e1e35;border-radius:4px;overflow:hidden;margin-top:5px;}
.wbf{height:100%;border-radius:4px;background:linear-gradient(90deg,#6bc47a,#c9a84c);}
.st{font-family:'Playfair Display',serif;font-size:18px;color:#c9a84c;margin-bottom:16px;border-bottom:1px solid #1e1e35;padding-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fi{display:flex;flex-direction:column;gap:4px;}
.fi label{font-family:'JetBrains Mono',monospace;font-size:9px;color:#666;text-transform:uppercase;letter-spacing:2px;}
.fi input,.fi select,.fi textarea{background:#0a0a12;border:1px solid #222238;border-radius:8px;color:#e8e0d0;font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px 10px;outline:none;width:100%;}
.fi input[readonly]{color:#c9a84c;}
.fi select option{background:#12121f;}
.bp{background:linear-gradient(135deg,#c9a84c,#a8882a);border:none;color:#0a0a0f;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:10px 22px;border-radius:8px;cursor:pointer;letter-spacing:2px;text-transform:uppercase;}
.bg{background:none;border:1px solid #1e1e35;color:#888;font-family:'JetBrains Mono',monospace;font-size:10px;padding:5px 10px;border-radius:6px;cursor:pointer;}
.bd{border-color:#c46b6b33;color:#c46b6b;}
.tr{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;}
.tg{background:#16162a;border:1px solid #222238;border-radius:20px;color:#888;font-family:'JetBrains Mono',monospace;font-size:10px;padding:4px 10px;cursor:pointer;user-select:none;}
.tg.on{background:#c9a84c22;color:#c9a84c;border-color:#c9a84c55;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:1px;}
.bw{background:#6bc47a22;color:#6bc47a;border:1px solid #6bc47a44;}
.bl{background:#c46b6b22;color:#c46b6b;border:1px solid #c46b6b44;}
.bb{background:#c9a84c22;color:#c9a84c;border:1px solid #c9a84c44;}
.empty{text-align:center;padding:40px;color:#444;font-family:'JetBrains Mono',monospace;font-size:12px;}
.rt{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #14141e;}
.rt:last-child{border:none;}
table{width:100%;border-collapse:collapse;}
th{font-family:'JetBrains Mono',monospace;font-size:9px;color:#555;text-transform:uppercase;letter-spacing:2px;padding:9px 12px;text-align:left;border-bottom:1px solid #1e1e35;}
td{font-family:'JetBrains Mono',monospace;font-size:11px;padding:10px 12px;border-bottom:1px solid #14141e;vertical-align:middle;}
tr:hover td{background:#12121e;}
.fw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.fb{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.tog{display:flex;align-items:center;gap:8px;cursor:pointer;}
.tt{width:34px;height:18px;background:#222;border-radius:20px;position:relative;border:1px solid transparent;flex-shrink:0;}
.tt.on{background:#6bc47a33;border-color:#6bc47a66;}
.th{width:12px;height:12px;background:#555;border-radius:50%;position:absolute;top:3px;left:3px;}
.th.on{left:19px;background:#6bc47a;}
.ss{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;}
.ss.sv2{color:#888;} .ss.ok{color:#6bc47a;} .ss.er{color:#c46b6b;}

/* Live Chart */
.live-chart-card{background:#10101a;border:1px solid #1e1e35;border-radius:12px;margin-bottom:16px;overflow:hidden;}
.live-chart-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1a1a2e;flex-wrap:wrap;gap:8px;}
.live-chart-title{font-family:'JetBrains Mono',monospace;font-size:13px;color:#c9a84c;font-weight:500;display:flex;align-items:center;gap:8px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#6bc47a;box-shadow:0 0 8px #6bc47a;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.live-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:#6bc47a;letter-spacing:2px;text-transform:uppercase;}
.tv-tf-row{display:flex;gap:4px;}
.tv-tf-btn{background:none;border:1px solid transparent;color:#555;font-family:'JetBrains Mono',monospace;font-size:9px;padding:3px 9px;border-radius:4px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;}
.tv-tf-btn.on{background:#c9a84c22;color:#c9a84c;border-color:#c9a84c44;}
.tv-wrap{width:100%;height:400px;position:relative;}
.tv-wrap iframe{width:100%;height:100%;border:none;display:block;}
.tv-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0a0a12;font-family:'JetBrains Mono',monospace;font-size:11px;color:#555;}
.tv-spinner{width:32px;height:32px;border:2px solid #1e1e35;border-top-color:#c9a84c;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:560px){.fg{grid-template-columns:1fr;}th:nth-child(n+4),td:nth-child(n+4){display:none;}.tv-wrap{height:300px;}}

/* Stats */
.stat-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
@media(max-width:560px){.stat-grid2{grid-template-columns:1fr;}}
.srow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #14141e;gap:8px;}
.srow:last-child{border:none;}
.srow-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:#888;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.srow-bar{flex:1;height:5px;background:#1e1e35;border-radius:4px;overflow:hidden;margin:0 10px;}
.srow-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#c9a84c,#6bc47a);}
.srow-val{font-family:'JetBrains Mono',monospace;font-size:11px;color:#c9a84c;text-align:right;min-width:50px;}
.srow-val.g{color:#6bc47a;} .srow-val.r{color:#c46b6b;}
.insight{background:#14141e;border:1px solid #c9a84c33;border-radius:8px;padding:12px 14px;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#888;line-height:1.7;}
.insight strong{color:#c9a84c;}
.no-data{text-align:center;padding:30px;color:#444;font-family:'JetBrains Mono',monospace;font-size:11px;}

/* Equity Chart */
.eq-canvas{display:block;width:100%;height:200px;border-radius:8px;background:#0a0a12;}
.eq-stats{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap;}
.eq-stat{font-family:'JetBrains Mono',monospace;font-size:11px;color:#555;}
.eq-stat span{color:#c9a84c;}

/* Export/Import */
.exim-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.exim-btn{background:none;border:1px solid #1e1e35;color:#888;font-family:'JetBrains Mono',monospace;font-size:10px;padding:8px 14px;border-radius:8px;cursor:pointer;letter-spacing:1px;display:flex;align-items:center;gap:6px;}
.exim-btn:hover{border-color:#c9a84c44;color:#c9a84c;}
.exim-btn.imp{border-color:#6bc47a33;color:#6bc47a;}
.exim-btn.imp:hover{background:#6bc47a11;}
</style>
</head>
<body>
<div class="header">
  <div class="logo">ICT <span>Journal</span></div>
  <div class="nav">
    <button class="nb on" id="btn-dashboard" onclick="go('dashboard')">📊 Dashboard</button>
    <button class="nb" id="btn-new" onclick="go('new')">✏️ Erfassen</button>
    <button class="nb" id="btn-log" onclick="go('log')">📋 Log</button>
    <button class="nb" id="btn-stats" onclick="go('stats')">🔍 Statistiken</button>
    <button class="nb" id="btn-equity" onclick="go('equity')">📈 Equity</button>
  </div>
  <div id="ss" class="ss"></div>
</div>
<div class="con">
  <div id="dashboard"></div>
  <div id="new" style="display:none"></div>
  <div id="log" style="display:none"></div>
  <div id="stats" style="display:none"></div>
  <div id="equity" style="display:none"></div>
  <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importJSON(this)"/>
</div>

<script>
var KEY='ict-v2',trades=[],cur='dashboard',editId=null,flt='all',rul=true;
var SESS=['London','New York','Asian','London/NY Overlap'];
var SETS=['Order Block','Fair Value Gap (FVG)','Breaker Block','Mitigation Block','Liquidity Sweep','Optimal Trade Entry (OTE)','Power of 3','CISD','Market Structure Shift (MSS)','Displacement'];
var BIAS=['Bullish','Bearish','Neutral'];
var PAIRS=['EURUSD','GBPUSD','USDJPY','XAUUSD','NAS100','US30','GBPJPY','AUDUSD','Andere'];
var EMOS=['😤 FOMO','😰 Angst','🧘 Ruhig','🤑 Gierig','😤 Ungeduldig','💪 Diszipliniert'];
var fm={};
var currentTf='D';
var tfMap={D:'D',H4:'240',H1:'60',M15:'15',M5:'5'};

function nf(){return{date:new Date().toISOString().slice(0,10),pair:'',bias:'',session:'',setup:'',entry:'',sl:'',tp:'',rr:'',result:'',pnl:'',notes:'',emotions:''};}
function load(){try{trades=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){trades=[];}}
function save(){
  var el=document.getElementById('ss');
  el.className='ss sv2';el.textContent='⏳ Speichern…';
  try{localStorage.setItem(KEY,JSON.stringify(trades));el.className='ss ok';el.textContent='✓ Gespeichert';setTimeout(function(){el.textContent='';},2000);}
  catch(e){el.className='ss er';el.textContent='✗ Fehler';}
}

function go(v){
  cur=v;
  ['dashboard','new','log','stats','equity'].forEach(function(n){
    document.getElementById(n).style.display=n===v?'':'none';
    var b=document.getElementById('btn-'+n);
    if(b){b.className='nb'+(n===v?' on':'');}
  });
  if(v==='dashboard')dash();
  if(v==='new')form();
  if(v==='log')log();
  if(v==='stats')statsPage();
  if(v==='equity')equityPage();
}

function badge(r){
  var c=r==='Win'?'bw':r==='Loss'?'bl':'bb';
  return '<span class="badge '+c+'">'+(r||'—')+'</span>';
}

// ─── TradingView Live Chart ───────────────────────────────────
function getTVUrl(tf){
  var interval=tfMap[tf]||'D';
  return 'https://s.tradingview.com/widgetembed/?frameElementId=tv_xauusd' +
    '&symbol=OANDA%3AXAUUSD' +
    '&interval='+interval+
    '&hidesidetoolbar=1' +
    '&hidetoptoolbar=0' +
    '&symboledit=0' +
    '&saveimage=0' +
    '&toolbarbg=0d0d18' +
    '&theme=dark' +
    '&style=1' +
    '&timezone=Europe%2FVienna' +
    '&studies=%5B%5D' +
    '&locale=de_DE' +
    '&utm_source=journal' +
    '&utm_medium=widget' +
    '&utm_campaign=chart';
}

function switchTf(tf){
  currentTf=tf;
  document.querySelectorAll('.tv-tf-btn').forEach(function(b){
    b.className='tv-tf-btn'+(b.dataset.tf===tf?' on':'');
  });
  var wrap=document.getElementById('tv-wrap');
  if(!wrap)return;
  wrap.innerHTML='<div class="tv-loading"><div class="tv-spinner"></div><span>Chart wird geladen…</span></div><iframe id="tv-iframe" src="'+getTVUrl(tf)+'" allowtransparency="true" scrolling="no" allowfullscreen></iframe>';
  var iframe=document.getElementById('tv-iframe');
  if(iframe){
    iframe.addEventListener('load',function(){
      var loader=wrap.querySelector('.tv-loading');
      if(loader)loader.style.display='none';
    });
  }
}

function liveChartHTML(){
  return '<div class="live-chart-card">' +
    '<div class="live-chart-header">' +
      '<div class="live-chart-title">' +
        '<div class="live-dot"></div>' +
        'XAUUSD &nbsp;<span style="color:#555;font-size:10px">Gold / USD · Spot</span>' +
        '&nbsp;&nbsp;<span class="live-label">LIVE</span>' +
      '</div>' +
      '<div class="tv-tf-row">' +
        ['M5','M15','H1','H4','D'].map(function(tf){
          return '<button class="tv-tf-btn'+(tf===currentTf?' on':'')+'" data-tf="'+tf+'" onclick="switchTf(\''+tf+'\')">'+tf+'</button>';
        }).join('') +
      '</div>' +
    '</div>' +
    '<div class="tv-wrap" id="tv-wrap">' +
      '<div class="tv-loading"><div class="tv-spinner"></div><span>Chart wird geladen…</span></div>' +
      '<iframe id="tv-iframe" src="'+getTVUrl(currentTf)+'" allowtransparency="true" scrolling="no" allowfullscreen></iframe>' +
    '</div>' +
  '</div>';
}

function dash(){
  var t=trades,w=t.filter(function(x){return x.result==='Win';}).length;
  var l=t.filter(function(x){return x.result==='Loss';}).length;
  var pnl=t.reduce(function(s,x){return s+(parseFloat(x.pnl)||0);},0).toFixed(2);
  var rr=t.length?(t.reduce(function(s,x){return s+(parseFloat(x.rr)||0);},0)/t.length).toFixed(2):'—';
  var wr=t.length?((w/t.length)*100).toFixed(1):'—';
  var pp=parseFloat(pnl)>=0;
  var wp=parseFloat(wr)>=50;
  var h='<div class="sgrid">';
  h+='<div class="stat"><div class="sv">'+(t.length||'—')+'</div><div class="sl">Trades</div></div>';
  h+='<div class="stat"><div class="sv '+(t.length?(wp?'g':'r'):'')+'">'+(t.length?wr+'%':'—')+'</div><div class="sl">Win Rate</div>'+(t.length?'<div class="wb"><div class="wbf" style="width:'+wr+'%"></div></div>':'')+'</div>';
  h+='<div class="stat"><div class="sv g">'+(t.length?w:'—')+'</div><div class="sl">Wins</div></div>';
  h+='<div class="stat"><div class="sv r">'+(t.length?l:'—')+'</div><div class="sl">Losses</div></div>';
  h+='<div class="stat"><div class="sv '+(t.length?(pp?'g':'r'):'')+'">'+(t.length?(pp?'+':'')+pnl+'R':'—')+'</div><div class="sl">P&L</div></div>';
  h+='<div class="stat"><div class="sv">'+rr+'</div><div class="sl">Ø R:R</div></div>';
  h+='</div>';

  // Live Chart
  h+=liveChartHTML();

  // Recent trades
  h+='<div class="card"><div class="st">Letzte Trades</div>';
  if(!t.length){h+='<div class="empty">📭 Noch keine Trades — erfasse deinen ersten Trade!</div>';}
  else{
    var recent=[].concat(t).reverse().slice(0,5);
    recent.forEach(function(x){
      var pc=parseFloat(x.pnl)>=0?'#6bc47a':'#c46b6b';
      h+='<div class="rt">';
      h+='<div><span style="color:#c9a84c;margin-right:10px">'+x.pair+'</span><span style="color:#666;font-size:11px">'+x.setup+'</span></div>';
      h+='<div class="fw"><span style="color:#666;font-size:10px">'+x.date+'</span>'+badge(x.result)+(x.pnl?'<span style="color:'+pc+';font-size:11px">'+(parseFloat(x.pnl)>=0?'+':'')+x.pnl+'R</span>':'')+'</div>';
      h+='</div>';
    });
  }
  h+='</div>';
  document.getElementById('dashboard').innerHTML=h;

  // Hook iframe load to hide spinner
  requestAnimationFrame(function(){
    var iframe=document.getElementById('tv-iframe');
    if(iframe){
      iframe.addEventListener('load',function(){
        var loader=document.querySelector('#tv-wrap .tv-loading');
        if(loader)loader.style.display='none';
      });
    }
  });
}

function form(){
  var h='<div class="card"><div class="st">'+(editId!==null?'Trade bearbeiten':'Neuen Trade erfassen')+'</div>';
  h+='<div class="fg" style="margin-bottom:14px">';
  h+='<div class="fi"><label>Datum</label><input type="date" id="fd" value="'+fm.date+'" oninput="fm.date=this.value"/></div>';
  h+='<div class="fi"><label>Pair</label><select id="fp" onchange="fm.pair=this.value"><option value="">— wählen —</option>'+PAIRS.map(function(p){return'<option'+(fm.pair===p?' selected':'')+'>'+p+'</option>';}).join('')+'</select></div>';
  h+='<div class="fi"><label>Bias</label><select id="fb2" onchange="fm.bias=this.value"><option value="">— wählen —</option>'+BIAS.map(function(b){return'<option'+(fm.bias===b?' selected':'')+'>'+b+'</option>';}).join('')+'</select></div>';
  h+='<div class="fi"><label>Session</label><select id="fs" onchange="fm.session=this.value"><option value="">— wählen —</option>'+SESS.map(function(s){return'<option'+(fm.session===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div>';
  h+='</div>';
  h+='<div class="fi" style="margin-bottom:14px"><label>ICT Setup</label><div class="tr">'+SETS.map(function(s){return'<div class="tg'+(fm.setup===s?' on':'')+'" onclick="selS(\''+s+'\')">'+s+'</div>';}).join('')+'</div></div>';
  h+='<div class="fg" style="margin-bottom:14px">';
  h+='<div class="fi"><label>Entry</label><input type="number" step="0.00001" placeholder="1.09450" value="'+fm.entry+'" oninput="fm.entry=this.value;crr()"/></div>';
  h+='<div class="fi"><label>Stop Loss</label><input type="number" step="0.00001" placeholder="1.09200" value="'+fm.sl+'" oninput="fm.sl=this.value;crr()"/></div>';
  h+='<div class="fi"><label>Take Profit</label><input type="number" step="0.00001" placeholder="1.09900" value="'+fm.tp+'" oninput="fm.tp=this.value;crr()"/></div>';
  h+='<div class="fi"><label>R:R (auto)</label><input id="rrd" readonly value="'+(fm.rr?'1 : '+fm.rr:'')+'"/></div>';
  h+='<div class="fi"><label>Ergebnis</label><select id="fr" onchange="fm.result=this.value"><option value="">— wählen —</option>'+['Win','Loss','Breakeven','Offen'].map(function(r){return'<option'+(fm.result===r?' selected':'')+'>'+r+'</option>';}).join('')+'</select></div>';
  h+='<div class="fi"><label>P&L in R</label><input type="number" step="0.01" placeholder="2.5 oder -1" value="'+fm.pnl+'" oninput="fm.pnl=this.value"/></div>';
  h+='</div>';
  h+='<div class="fi" style="margin-bottom:14px"><label>Emotionen</label><div class="tr">'+EMOS.map(function(e){return'<div class="tg'+(fm.emotions===e?' on':'')+'" onclick="selE(\''+e+'\')">'+e+'</div>';}).join('')+'</div></div>';
  h+='<div class="fi" style="margin-bottom:14px"><label>Notizen</label><textarea rows="3" oninput="fm.notes=this.value" style="resize:vertical">'+fm.notes+'</textarea></div>';
  h+='<div class="fb">';
  h+='<div class="tog" onclick="togR()"><div class="tt'+(rul?' on':'')+'" id="tt"><div class="th'+(rul?' on':'')+'" id="th"></div></div><span style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:#888">ICT-Regeln befolgt</span></div>';
  h+='<div class="fw">'+(editId!==null?'<button class="bg" onclick="canc()">Abbrechen</button>':'')+'<button class="bp" onclick="sub()">'+(editId!==null?'Speichern':'Trade hinzufügen')+'</button></div>';
  h+='</div></div>';
  document.getElementById('new').innerHTML=h;
}

function selS(s){fm.setup=s;form();}
function selE(e){fm.emotions=e;form();}
function togR(){rul=!rul;document.getElementById('tt').className='tt'+(rul?' on':'');document.getElementById('th').className='th'+(rul?' on':'');}
function crr(){
  var e=parseFloat(fm.entry),s=parseFloat(fm.sl),t=parseFloat(fm.tp);
  if(e&&s&&t){var r=Math.abs(e-s),w=Math.abs(t-e);fm.rr=r>0?(w/r).toFixed(2):'';}else{fm.rr='';}
  var el=document.getElementById('rrd');if(el)el.value=fm.rr?'1 : '+fm.rr:'';
}
function canc(){editId=null;fm=nf();rul=true;form();}
function sub(){
  ['fp','fb2','fs','fr'].forEach(function(id){var el=document.getElementById(id);if(el)fm[{fp:'pair',fb2:'bias',fs:'session',fr:'result'}[id]]=el.value;});
  if(!fm.pair||!fm.setup||!fm.date){alert('Bitte Datum, Pair und Setup angeben.');return;}
  var tr=Object.assign({},fm,{followed_rules:rul,id:editId!==null?editId:Date.now()});
  if(editId!==null){trades=trades.map(function(t){return t.id===editId?tr:t;});editId=null;}
  else{trades.push(tr);}
  fm=nf();rul=true;save();go('log');
}

function log(){
  var ft=flt==='all'?trades:trades.filter(function(t){return t.pair===flt;});
  var h='<div class="fw" style="margin-bottom:12px"><span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:#555;margin-right:4px">FILTER:</span>';
  h+=['all'].concat(PAIRS).map(function(p){return'<div class="tg'+(flt===p?' on':'')+'" onclick="setF(\''+p+'\')">'+( p==='all'?'Alle':p)+'</div>';}).join('');
  h+='</div>';
  h+='<div class="card" style="padding:0;overflow:hidden">';
  if(!ft.length){h+='<div class="empty">Keine Trades.</div>';}
  else{
    h+='<table><thead><tr><th>Datum</th><th>Pair</th><th>Setup</th><th>Session</th><th>R:R</th><th>P&L</th><th>Result</th><th></th></tr></thead><tbody>';
    [].concat(ft).reverse().forEach(function(t){
      var pc=parseFloat(t.pnl)>=0?'#6bc47a':'#c46b6b';
      h+='<tr>';
      h+='<td style="color:#666">'+t.date+'</td>';
      h+='<td style="color:#c9a84c">'+t.pair+'</td>';
      h+='<td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t.setup+'</td>';
      h+='<td style="color:#666">'+(t.session||'—')+'</td>';
      h+='<td style="color:#888">'+(t.rr?'1:'+t.rr:'—')+'</td>';
      h+='<td style="color:'+pc+'">'+(t.pnl?(parseFloat(t.pnl)>=0?'+':'')+t.pnl+'R':'—')+'</td>';
      h+='<td>'+badge(t.result)+'</td>';
      h+='<td><div class="fw"><button class="bg" style="padding:3px 7px" onclick="ed('+t.id+')">✏️</button><button class="bg bd" style="padding:3px 7px" onclick="del('+t.id+')">🗑</button></div></td>';
      h+='</tr>';
    });
    h+='</tbody></table>';
  }
  h+='</div>';
  document.getElementById('log').innerHTML=h;
}

function setF(p){flt=p;log();}
function del(id){if(!confirm('Löschen?'))return;trades=trades.filter(function(t){return t.id!==id;});save();log();}
function ed(id){var t=trades.find(function(x){return x.id===id;});if(!t)return;fm=Object.assign({},t);editId=id;rul=t.followed_rules!==false;go('new');}

function statsPage(){
  var t=trades.filter(function(x){return x.result==='Win'||x.result==='Loss';});
  var el=document.getElementById('stats');
  if(!t.length){
    el.innerHTML='<div class="card"><div class="st">🔍 Statistiken</div><div class="no-data">📭 Noch keine abgeschlossenen Trades (Win/Loss).<br>Erfasse mindestens einen Trade um Statistiken zu sehen.</div></div>';
    return;
  }

  function wr(arr){
    var w=arr.filter(function(x){return x.result==='Win';}).length;
    return arr.length?Math.round(w/arr.length*100):0;
  }
  function avgRR(arr){
    var v=arr.filter(function(x){return parseFloat(x.rr)>0;});
    if(!v.length)return null;
    return (v.reduce(function(s,x){return s+parseFloat(x.rr);},0)/v.length).toFixed(2);
  }
  function pnl(arr){
    return arr.reduce(function(s,x){return s+(parseFloat(x.pnl)||0);},0).toFixed(2);
  }

  function makeRows(groups,label){
    var keys=Object.keys(groups).filter(function(k){return groups[k].length>0;});
    if(!keys.length)return '<div class="no-data">Keine Daten</div>';
    var maxWr=Math.max.apply(null,keys.map(function(k){return wr(groups[k]);}));
    return keys.sort(function(a,b){return wr(groups[b])-wr(groups[a]);}).map(function(k){
      var arr=groups[k];
      var w=wr(arr);
      var rr=avgRR(arr)||'—';
      var p=parseFloat(pnl(arr));
      var pClass=p>=0?'g':'r';
      return '<div class="srow">'+
        '<span class="srow-label" title="'+k+'">'+k+'</span>'+
        '<div class="srow-bar"><div class="srow-fill" style="width:'+( maxWr?Math.round(w/maxWr*100):0)+'%"></div></div>'+
        '<span class="srow-val">'+w+'%</span>'+
        '<span class="srow-val" style="min-width:40px;color:#666;font-size:10px">'+arr.length+'T</span>'+
        '<span class="srow-val '+pClass+'" style="min-width:52px">'+(p>=0?'+':'')+p+'R</span>'+
      '</div>';
    }).join('');
  }

  // Group by session
  var bySess={};
  SESS.forEach(function(s){bySess[s]=t.filter(function(x){return x.session===s;});});

  // Group by setup
  var bySetup={};
  SETS.forEach(function(s){bySetup[s]=t.filter(function(x){return x.setup===s;});});

  // Group by pair
  var byPair={};
  PAIRS.forEach(function(p){byPair[p]=t.filter(function(x){return x.pair===p;});});

  // Group by rules followed
  var withRules=t.filter(function(x){return x.followed_rules!==false;});
  var withoutRules=t.filter(function(x){return x.followed_rules===false;});
  var wrWith=wr(withRules), wrWithout=wr(withoutRules);

  // Best insight
  var bestSess=Object.keys(bySess).filter(function(k){return bySess[k].length>0;}).sort(function(a,b){return wr(bySess[b])-wr(bySess[a]);})[0]||null;
  var bestSetup=Object.keys(bySetup).filter(function(k){return bySetup[k].length>0;}).sort(function(a,b){return wr(bySetup[b])-wr(bySetup[a]);})[0]||null;
  var bestPair=Object.keys(byPair).filter(function(k){return byPair[k].length>0;}).sort(function(a,b){return wr(byPair[b])-wr(byPair[a]);})[0]||null;

  var insightText='';
  if(bestSess)insightText+='Deine beste Session ist <strong>'+bestSess+'</strong> ('+wr(bySess[bestSess])+'% WR). ';
  if(bestSetup)insightText+='Dein stärkstes Setup ist <strong>'+bestSetup+'</strong> ('+wr(bySetup[bestSetup])+'% WR). ';
  if(withRules.length&&withoutRules.length){
    insightText+='Mit ICT-Regeln: <strong>'+wrWith+'%</strong> WR — ohne Regeln: <strong>'+wrWithout+'%</strong> WR. ';
    if(wrWith>wrWithout)insightText+='<strong style="color:#6bc47a">Die Regeln helfen dir! 💪</strong>';
    else insightText+='<strong style="color:#c46b6b">Achtung: Ohne Regeln läuft es besser — überprüfe deine Strategie.</strong>';
  }

  var h='';

  // Regelkonformität card
  if(withRules.length||withoutRules.length){
    h+='<div class="card"><div class="st">⚖️ ICT-Regeln Einfluss</div>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
    if(withRules.length){h+='<div class="stat"><div class="sv g">'+wrWith+'%</div><div class="sl">WR mit Regeln</div><div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:#555;margin-top:4px">'+withRules.length+' Trades</div></div>';}
    if(withoutRules.length){h+='<div class="stat"><div class="sv r">'+wrWithout+'%</div><div class="sl">WR ohne Regeln</div><div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:#555;margin-top:4px">'+withoutRules.length+' Trades</div></div>';}
    h+='</div></div>';
  }

  h+='<div class="stat-grid2">';

  // Session
  h+='<div class="card" style="margin:0"><div class="st" style="font-size:15px">🕐 Session</div>';
  h+='<div style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:#555;display:flex;gap:16px;margin-bottom:8px"><span>— WINRATE</span><span style="margin-left:auto">TRADES</span><span>P&L</span></div>';
  h+=makeRows(bySess)+'</div>';

  // Pair
  h+='<div class="card" style="margin:0"><div class="st" style="font-size:15px">💱 Pair</div>';
  h+='<div style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:#555;display:flex;gap:16px;margin-bottom:8px"><span>— WINRATE</span><span style="margin-left:auto">TRADES</span><span>P&L</span></div>';
  h+=makeRows(byPair)+'</div>';

  h+='</div>';

  // Setup
  h+='<div class="card"><div class="st">🎯 Setup Performance</div>';
  h+='<div style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:#555;display:flex;gap:16px;margin-bottom:8px"><span>— WINRATE</span><span style="margin-left:auto">TRADES</span><span>P&L</span></div>';
  h+=makeRows(bySetup)+'</div>';

  // Insight
  if(insightText){
    h+='<div class="card"><div class="st">💡 Deine Erkenntnisse</div><div class="insight">'+insightText+'</div></div>';
  }

  el.innerHTML=h;
}

// ─── EQUITY KURVE ─────────────────────────────────────────────
function equityPage(){
  var el=document.getElementById('equity');
  var closed=trades.filter(function(t){return t.result==='Win'||t.result==='Loss'||t.result==='Breakeven';});
  closed.sort(function(a,b){return a.date>b.date?1:-1;});

  if(!closed.length){
    el.innerHTML='<div class="card"><div class="st">📈 Equity Kurve</div><div class="no-data">📭 Noch keine abgeschlossenen Trades.<br>Erfasse Trades um deine Equity Kurve zu sehen.</div></div>';
    return;
  }

  // Build equity data
  var points=[{label:'Start',eq:0}];
  var running=0;
  closed.forEach(function(t){
    running+=parseFloat(t.pnl)||0;
    points.push({label:t.date.slice(5),eq:parseFloat(running.toFixed(2))});
  });

  var maxEq=Math.max.apply(null,points.map(function(p){return p.eq;}));
  var minEq=Math.min.apply(null,points.map(function(p){return p.eq;}));
  var finalEq=points[points.length-1].eq;
  var maxDD=0; var peak=0;
  points.forEach(function(p){if(p.eq>peak)peak=p.eq; var dd=peak-p.eq; if(dd>maxDD)maxDD=dd;});
  var bestTrade=closed.reduce(function(best,t){return (parseFloat(t.pnl)||0)>(parseFloat(best.pnl)||0)?t:best;},closed[0]);
  var worstTrade=closed.reduce(function(worst,t){return (parseFloat(t.pnl)||0)<(parseFloat(worst.pnl)||0)?t:worst;},closed[0]);

  var h='<div class="card">';
  h+='<div class="st">📈 Equity Kurve <span style="font-family:\'JetBrains Mono\',monospace;font-size:13px;color:'+(finalEq>=0?'#6bc47a':'#c46b6b')+'">'+(finalEq>=0?'+':'')+finalEq+'R</span></div>';
  h+='<canvas id="eq-canvas" class="eq-canvas"></canvas>';
  h+='<div class="eq-stats">';
  h+='<div class="eq-stat">Max Drawdown: <span style="color:#c46b6b">'+maxDD.toFixed(2)+'R</span></div>';
  h+='<div class="eq-stat">Bester Trade: <span style="color:#6bc47a">+'+(parseFloat(bestTrade.pnl)||0).toFixed(2)+'R</span> ('+bestTrade.pair+')</div>';
  h+='<div class="eq-stat">Schlechtester: <span style="color:#c46b6b">'+(parseFloat(worstTrade.pnl)||0).toFixed(2)+'R</span> ('+worstTrade.pair+')</div>';
  h+='<div class="eq-stat">Trades: <span>'+closed.length+'</span></div>';
  h+='</div></div>';

  // Export/Import card
  h+='<div class="card"><div class="st">💾 Backup</div>';
  h+='<div style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:#666;margin-bottom:10px">Exportiere deine Trades als JSON-Datei um sie zu sichern oder auf ein anderes Gerät zu übertragen.</div>';
  h+='<div class="exim-row">';
  h+='<button class="exim-btn" onclick="exportJSON()">📤 Exportieren (JSON)</button>';
  h+='<button class="exim-btn imp" onclick="document.getElementById(\'imp-file\').click()">📥 Importieren (JSON)</button>';
  h+='</div></div>';

  el.innerHTML=h;

  // Draw canvas
  requestAnimationFrame(function(){
    var canvas=document.getElementById('eq-canvas');
    if(!canvas)return;
    var dpr=window.devicePixelRatio||1;
    var W=canvas.getBoundingClientRect().width;
    var H=200;
    canvas.width=W*dpr; canvas.height=H*dpr;
    var ctx=canvas.getContext('2d');
    ctx.scale(dpr,dpr);

    var PAD={top:16,right:16,bottom:28,left:48};
    var cw=W-PAD.left-PAD.right;
    var ch=H-PAD.top-PAD.bottom;
    var n=points.length;
    var range=Math.max(0.1,maxEq-minEq);
    var padR=range*0.1;
    var lo=minEq-padR, hi=maxEq+padR;

    function toX(i){return PAD.left+cw*(i/(n-1));}
    function toY(v){return PAD.top+ch-((v-lo)/(hi-lo))*ch;}

    // Background
    ctx.fillStyle='#08080f'; ctx.fillRect(0,0,W,H);

    // Zero line
    var zeroY=toY(0);
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(PAD.left,zeroY); ctx.lineTo(W-PAD.right,zeroY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#333'; ctx.font='9px JetBrains Mono,monospace'; ctx.textAlign='right';
    ctx.fillText('0',PAD.left-4,zeroY+3);

    // Y labels
    [lo,hi].forEach(function(v){
      var y=toY(v);
      ctx.fillStyle='#333'; ctx.font='9px JetBrains Mono,monospace'; ctx.textAlign='right';
      ctx.fillText(v.toFixed(1)+'R',PAD.left-4,y+3);
    });

    // Fill gradient
    var grad=ctx.createLinearGradient(0,PAD.top,0,H-PAD.bottom);
    grad.addColorStop(0,finalEq>=0?'rgba(107,196,122,0.25)':'rgba(196,107,107,0.25)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.moveTo(toX(0),toY(points[0].eq));
    points.forEach(function(p,i){ctx.lineTo(toX(i),toY(p.eq));});
    ctx.lineTo(toX(n-1),H-PAD.bottom);
    ctx.lineTo(toX(0),H-PAD.bottom);
    ctx.closePath();
    ctx.fillStyle=grad; ctx.fill();

    // Line
    ctx.beginPath();
    ctx.strokeStyle=finalEq>=0?'#6bc47a':'#c46b6b';
    ctx.lineWidth=2; ctx.lineJoin='round';
    points.forEach(function(p,i){i===0?ctx.moveTo(toX(i),toY(p.eq)):ctx.lineTo(toX(i),toY(p.eq));});
    ctx.stroke();

    // Dots + labels
    var step=Math.max(1,Math.floor(n/8));
    points.forEach(function(p,i){
      ctx.beginPath();
      ctx.arc(toX(i),toY(p.eq),3,0,Math.PI*2);
      ctx.fillStyle=p.eq>=0?'#6bc47a':'#c46b6b';
      ctx.fill();
      if(i%step===0){
        ctx.fillStyle='#444'; ctx.font='8px JetBrains Mono,monospace'; ctx.textAlign='center';
        ctx.fillText(p.label,toX(i),H-PAD.bottom+14);
      }
    });
  });
}

// ─── EXPORT / IMPORT ──────────────────────────────────────────
function exportJSON(){
  if(!trades.length){alert('Keine Trades zum Exportieren.');return;}
  var data=JSON.stringify({version:'ict-v2',exported:new Date().toISOString(),trades:trades},null,2);
  var blob=new Blob([data],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='ict-journal-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
}

function importJSON(input){
  var file=input.files[0]; if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      var imported=data.trades||data;
      if(!Array.isArray(imported))throw new Error('Ungültiges Format');
      if(!confirm(''+imported.length+' Trades importieren? Bestehende Trades bleiben erhalten.'))return;
      var existing=trades.map(function(t){return t.id;});
      var added=0;
      imported.forEach(function(t){
        if(!existing.includes(t.id)){trades.push(t);added++;}
      });
      save();
      alert(added+' neue Trades importiert!');
      go('equity');
    }catch(err){alert('Fehler beim Importieren: '+err.message);}
  };
  reader.readAsText(file);
  input.value='';
}

load();
fm=nf();
dash();
